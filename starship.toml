[character]
success_symbol = "[❯](bold white)"
error_symbol = "[❯](bold red)"

[directory]
style = "white"
truncation_length = 3

[username]
show_always = true
style_user = "dimmed white"
format = "[$user]($style) "

[hostname]
ssh_only = false
style = "dimmed white"
format = "[$hostname]($style) "
