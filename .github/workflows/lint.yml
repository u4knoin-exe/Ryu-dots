name: lint
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4
      - name: shellcheck
        run: shellcheck -x -S warning install.sh theme/apply.sh theme/check.sh bin/* home/.bashrc
      - name: lua syntax
        run: |
          find config -name '*.lua' -o -name '*.lua.tpl' | while read -r f; do
            sed 's/{{[a-z_0-9]*}}/x/g' "$f" | luac5.4 -p - || { echo "lua error in $f"; exit 1; }
          done
      - name: templates and palettes
        run: ./theme/check.sh
