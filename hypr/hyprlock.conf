general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    color = rgba(10, 10, 12, 0.85)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.90
    brightness = 0.65
    vibrancy = 0.15
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.65)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2
    outer_color = rgba(255, 255, 255, 0.20)
    inner_color = rgba(15, 15, 18, 0.55)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    rounding = 18
    placeholder_text = <i>Enter password...</i>
    position = 0, -80
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.config/hypr/assets/pfp.jpeg
    size = 160
    rounding = 80
    border_size = 2
    border_color = rgba(255,255,255,0.25)
    position = 0, 220
    halign = center
    valign = center
}
