general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    color = rgba(10, 10, 12, 0.85)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.90
    brightness = 0.65
    vibrancy = 0.15
}

label { # date, sits just above the time
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %-d')"
    color = rgba(203, 166, 247, 0.85)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 165
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 76
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 0, 90
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

label {
    monitor =
    text = $USER
    color = rgba(180, 190, 254, 0.75)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 56
    outline_thickness = 2
    outer_color = rgba(203, 166, 247, 0.35)
    inner_color = rgba(15, 15, 18, 0.55)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    rounding = -1
    placeholder_text = <i>Enter password...</i>
    dots_size = 0.3
    dots_spacing = 0.35
    dots_center = true
    fail_color = rgba(220, 90, 90, 0.9)
    position = 0, -70
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.config/hypr/assets/pfp.jpeg
    size = 150
    rounding = -1
    border_size = 3
    border_color = rgba(203, 166, 247, 0.6)
    position = 0, 220
    halign = center
    valign = center
}
