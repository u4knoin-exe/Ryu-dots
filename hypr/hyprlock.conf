general {
    hide_cursor = true
    immediate_render = true
    text_trim = true
}

background {
    monitor =
    path = screenshot

    blur_passes = 2
    blur_size = 5
    noise = 0.006
    contrast = 0.92
    brightness = 0.74
    vibrancy = 0.06
}

# ─────────────────────────────────────
# DATE
# ─────────────────────────────────────

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A  ·  %d %B')"

    color = rgba(255, 255, 255, 0.58)
    font_size = 14
    font_family = Iosevka Nerd Font Mono

    position = 0, 150
    halign = center
    valign = center
}

# ─────────────────────────────────────
# TIME
# ─────────────────────────────────────

label {
    monitor =
    text = $TIME

    color = rgba(255, 255, 255, 0.97)
    font_size = 78
    font_family = Iosevka Nerd Font Mono

    position = 0, 78
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.50)
}

# ─────────────────────────────────────
# USER
# ─────────────────────────────────────

label {
    monitor =
    text = $USER

    color = rgba(255, 255, 255, 0.62)
    font_size = 14
    font_family = Iosevka Nerd Font Mono

    position = 0, -2
    halign = center
    valign = center
}

# ─────────────────────────────────────
# KEYBOARD LAYOUT
# ─────────────────────────────────────

label {
    monitor =
    text = $LAYOUT

    color = rgba(255, 255, 255, 0.38)
    font_size = 11
    font_family = Iosevka Nerd Font Mono

    position = 0, -35
    halign = center
    valign = center
}

# ─────────────────────────────────────
# PASSWORD
# ─────────────────────────────────────

input-field {
    monitor =

    size = 330, 56

    outline_thickness = 1
    rounding = 18

    outer_color = rgba(255, 255, 255, 0.16)
    inner_color = rgba(10, 10, 13, 0.78)

    font_color = rgba(255, 255, 255, 0.95)
    font_family = Iosevka Nerd Font Mono

    fade_on_empty = false

    dots_size = 0.27
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1

    placeholder_text = <span foreground='#77777f'>Enter password</span>

    fail_color = rgba(255, 100, 100, 0.90)

    position = 0, -72
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.35)
}

# ─────────────────────────────────────
# PROFILE
# ─────────────────────────────────────

image {
    monitor =
    path = ~/.config/hypr/assets/pfp.jpeg

    size = 112
    rounding = 56

    border_size = 2
    border_color = rgba(255, 255, 255, 0.18)

    position = 0, 285
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.45)
}
